<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangladesh Income Tax Calculator</title>
<style>
  :root {
    --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #006a4e;   /* Bangladesh bottle green */
    --warn: #b45309; --good: #15803d; --bg: #f8fafc;
    --num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--ink); background: var(--bg); line-height: 1.45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  header { text-align: center; padding: 1.5rem 1rem 0.5rem; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
         max-width: 960px; margin: 1rem auto; padding: 0 1rem; align-items: start; }
  main > * { min-width: 0; }  /* let grid panels shrink below content width */
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }
  #breakdown { position: sticky; top: 1rem; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 1rem; padding: 0.6rem 0.8rem; }
  legend { font-size: 0.8rem; color: var(--muted); padding: 0 0.3rem; }
  label.field { display: block; margin-bottom: 0.9rem; font-weight: 600; font-size: 0.95rem; }
  label.field input[type=number], label.field select {
    display: block; width: 100%; margin-top: 0.25rem; padding: 0.45rem 0.6rem;
    border: 1px solid var(--line); border-radius: 6px; font-size: 1rem; font-weight: 400; }
  input[type=number] { font-family: var(--num); }
  .hint { font-weight: 400; font-size: 0.8rem; color: var(--muted); display: block; }
  .inline { display: flex; align-items: center; gap: 0.5rem; font-weight: 400; margin-bottom: 0.6rem; }
  .inline input[type=number] { width: 4.5rem; padding: 0.3rem; border: 1px solid var(--line); border-radius: 6px; }
  h2 { font-size: 1rem; margin: 1.2rem 0 0.5rem; }
  .salary-row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.5rem; }
  .salary-row input.amount { flex: 1 1 8rem; }
  .salary-row input { flex: 1; min-width: 0; padding: 0.45rem 0.6rem;
    border: 1px solid var(--line); border-radius: 6px; font-size: 1rem; }
  .salary-row select { padding: 0.45rem 0.3rem; border: 1px solid var(--line); border-radius: 6px; }
  .salary-row button { border: none; background: none; color: var(--muted);
    font-size: 1.1rem; cursor: pointer; padding: 0.2rem; }
  .salary-row button:hover { color: var(--warn); }
  .add-row { background: none; border: 1px dashed var(--accent); color: var(--accent);
    border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.9rem; margin-bottom: 0.9rem; }
  fieldset.employer legend { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  #addEmployer { width: 100%; background: var(--bg); border: 1px dashed #9ca3af; color: var(--ink);
    border-radius: 8px; padding: 0.6rem; cursor: pointer; font-size: 0.9rem; }
  .remove-employer { background: none; border: none; color: var(--warn); cursor: pointer;
    font-size: 0.85rem; padding: 0.3rem 0; }
  .warn { color: var(--warn); font-size: 0.85rem; min-height: 1.2em; margin: 0.3rem 0 0; }
  .tip { color: var(--accent); font-size: 0.85rem; margin: 0.3rem 0 0; }
  /* itemized investments */
  #investments details { margin-bottom: 0.9rem; }
  #investments summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; padding: 0.4rem 0;
    margin-bottom: 0.6rem; }
  .cap-warn { display: block; color: var(--warn); font-size: 0.8rem; font-weight: 400; margin-top: 0.2rem; }
  .cap-warn:empty { display: none; }
  .invest-summary { border-left: 3px solid var(--line); padding-left: 0.7rem; margin-bottom: 1rem; }
  .invest-total { margin: 0 0 0.2rem; font-weight: 600; font-size: 0.95rem; }
  .invest-summary .hint { margin: 0; }
  /* breakdown pane — ledger/receipt treatment */
  #breakdown { border-top: 4px solid var(--accent); }
  .bd-title { margin: 0 0 0.75rem; font-size: 0.8rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .bd-line { display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.3rem 0; font-size: 0.95rem; }
  .bd-line .lbl { color: var(--ink); }
  .bd-line .lbl small { color: var(--muted); display: block; font-size: 0.75rem;
    font-weight: 400; }
  .bd-line .amt { font-family: var(--num); font-size: 0.9rem;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bd-sub { color: var(--muted); font-size: 0.85rem; }
  .bd-rule { border-top: 1px solid var(--line); margin: 0.5rem 0; }
  .bd-tear { border-top: 1px dashed #9ca3af; margin: 0.7rem 0 0.15rem; }
  .bd-total { font-size: 1.3rem; font-weight: 700; display: flex;
    align-items: baseline; justify-content: space-between; padding-top: 0.6rem; }
  .bd-total .amt { font-family: var(--num); font-size: 1.9rem;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    color: var(--accent); }
  .bd-total.refund { color: var(--good); }
  .bd-total.refund .amt { color: var(--good); }
  /* monthly deduction plan */
  .plan { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .plan-head { margin: 0; font-size: 0.95rem; }
  .plan-head .amt { font-family: var(--num); font-variant-numeric: tabular-nums;
    font-size: 1.3rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .plan-sub { display: block; color: var(--muted); font-size: 0.75rem; margin: 0.2rem 0 0.7rem; }
  .plan-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; }
  .plan-cell { border-radius: 6px; padding: 0.35rem 0.15rem; text-align: center; font-size: 0.72rem; }
  .plan-cell b { display: block; font-weight: 600; }
  .plan-cell span { font-family: var(--num); font-variant-numeric: tabular-nums; }
  .plan-cell.deducted { background: #004d38; color: #fff; }
  .plan-cell.planned { background: #e6f2ee; color: #004d38; }
  .plan-cell.none { background: #f3f4f6; color: var(--muted); }
  .plan-key { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin-top: 0.5rem;
    font-size: 0.72rem; color: var(--muted); }
  .plan-key i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px;
    margin-right: 0.3rem; vertical-align: -0.1rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem;
    padding: 1.5rem 1rem 2rem; }
  footer a { color: var(--accent); }
  /* mobile-only sticky total bar; desktop already keeps the pane in view */
  .sticky-total { display: none; }
  @media (max-width: 800px) {
    body { padding-bottom: 3.5rem; }
    .sticky-total { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 0.6rem 1rem; background: #fff; border-top: 2px solid var(--accent);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08); font-weight: 700; }
    .sticky-total .amt { font-family: var(--num); font-size: 1.25rem;
      font-variant-numeric: tabular-nums; color: var(--accent); }
    .sticky-total.refund, .sticky-total.refund .amt { color: var(--good); }
    .sticky-total.pane-visible { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Bangladesh Income Tax Calculator</h1>
  <p>For salaried people — everything calculates live, nothing is stored</p>
</header>
<main>
  <form class="panel" id="form" autocomplete="off">
    <label class="field">Tax year
      <select id="taxYear"></select>
      <span class="hint" id="yearHint"></span>
    </label>

    <label class="field">Taxpayer category
      <select id="category">
        <option value="general">General (male)</option>
        <option value="woman">Woman</option>
        <option value="senior">Senior citizen (65+)</option>
        <option value="thirdGender">Third gender</option>
        <option value="disabled">Person with disability</option>
        <option value="freedomFighter">War-wounded freedom fighter</option>
        <option value="julyWarrior">July Warrior</option>
      </select>
    </label>
    <label class="inline"><input type="checkbox" id="firstTime"> First-time taxpayer
      <span class="hint">(minimum tax ৳1,000 instead of ৳5,000)</span></label>
    <label class="inline">Disabled dependents
      <input type="number" id="dependents" min="0" step="1" value="0">
      <span class="hint">+৳50,000 tax-free each</span></label>

    <h2>Salary</h2>
    <div id="employers"></div>
    <button type="button" id="addEmployer">+ Add another employer (changed jobs this year)</button>
    <p class="warn" id="salaryWarning" role="status"></p>

    <h2>Other income (yearly total)</h2>
    <label class="field">Other income
      <span class="hint">bank interest, side income etc. — added to taxable income as-is</span>
      <input type="number" id="otherIncome" min="0" placeholder="0">
    </label>
    <h2>Investments for rebate (this year)</h2>
    <div id="investments"></div>
    <div class="invest-summary">
      <p class="invest-total" id="investmentTotal"></p>
      <p class="hint" id="investmentFormula"></p>
      <p class="tip" id="investmentHint"></p>
    </div>
    <h2>Monthly deduction</h2>
    <label class="field">Next salary month
      <span class="hint">the first month not yet deducted — set from today's date</span>
      <select id="nextMonth"></select>
    </label>
  </form>

  <aside class="panel" id="breakdown"></aside>
  <span id="liveTotal" class="sr-only" aria-live="polite"></span>
</main>
<div id="stickyTotal" class="sticky-total" aria-hidden="true">
  <span class="lbl">Payable</span><span class="amt">৳0</span>
</div>
<footer>
  <span id="footerBasis"></span>
  Estimates only — not tax advice.
  Official source: <a href="https://nbr.gov.bd" target="_blank" rel="noopener">nbr.gov.bd</a>
</footer>
<script src="tax.js"></script>
<script src="app.js"></script>
</body>
</html>
