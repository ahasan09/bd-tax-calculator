# Publish only the calculator to GitHub Pages — tests, docs and other repo
# files stay out of the site. The engine tests must pass before deploying.
name: Deploy calculator to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Test, then package only the calculator files.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run engine tests
        run: node run-tests.mjs

      - name: Collect the calculator files
        run: |
          mkdir _site
          cp index.html tax.js state.js i18n.js app.js _site/
          # Fail if the page loads a script that wasn't copied.
          for f in $(grep -o 'src="[^"]*"' index.html | sed 's/src="//; s/"$//'); do
            test -f "_site/$f" || { echo "missing $f"; exit 1; }
          done
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, as in GitHub's own Pages template — the uploaded
  # artifact is reliably visible by the time this starts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
