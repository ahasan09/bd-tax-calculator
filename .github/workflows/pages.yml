# Publish only the calculator to GitHub Pages — tests, docs and other repo
# files stay out of the site. The engine tests must pass before deploying.
name: Deploy calculator to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run engine tests
        run: node run-tests.mjs

      - name: Collect the calculator files
        run: |
          mkdir _site
          cp index.html tax.js state.js i18n.js app.js _site/
          # Fail if the page loads a script that wasn't copied.
          for f in $(grep -o 'src="[^"]*"' index.html | sed 's/src="//; s/"$//'); do
            test -f "_site/$f" || { echo "missing $f"; exit 1; }
          done
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
